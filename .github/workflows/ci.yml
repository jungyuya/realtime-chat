name: Deploy to Single VM

on:
  push:
    branches: [ "main" ]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1 # 미국 (오와이아)
  REPO_NAME: realtime-chat-repo

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. GCP 인증 (JSON Key 방식)
      - name: Google Auth
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      # 2. Docker 설정
      - name: Configure Docker
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      # 3. 백엔드 빌드 & 푸시
      - name: Build and Push Backend
        run: |
          IMAGE_URI=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/backend
          docker build -t $IMAGE_URI:latest -f apps/backend/Dockerfile .
          docker push $IMAGE_URI:latest

      # 4. 프론트엔드 빌드 & 푸시
      - name: Build and Push Frontend
        run: |
          IMAGE_URI=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/frontend
          # [중요] 도메인 주소로 환경 변수 주입
          docker build \
            --build-arg VITE_API_BASE_URL=https://chat.jungyu.store \
            -t $IMAGE_URI:latest \
            -f apps/frontend/Dockerfile .
          docker push $IMAGE_URI:latest

      # 5. 설정 파일 생성 및 전송 (SCP)
      # .env.prod는 보안상 Git에 없으므로, Secrets에서 값을 가져와 런너에서 생성한 뒤 전송합니다.
      - name: Make envfile
        run: |
          echo "${{ secrets.ENV_PROD }}" > .env.prod

      - name: Copy files to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # 전송할 파일 목록: docker-compose 파일, nginx 설정, 방금 만든 .env.prod
          source: "docker-compose.prod.yml,nginx/conf.d/default.conf,.env.prod"
          # 서버의 타겟 디렉토리
          target: "~/app"
          # 파일 덮어쓰기 허용
          overwrite: true

      # 6. 서버에서 배포 명령어 실행 (SSH)
      - name: Deploy on Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 작업 디렉토리로 이동
            cd ~/app
            
            # GCP Artifact Registry 로그인을 위해 gcloud credential helper 설정
            # (VM에 서비스 계정이 연결되어 있어도 명시적 설정이 안전함)
            sudo gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

            #  pull 할 때도 환경 변수 파일이 필요할 수 있으므로 추가 (경고 방지)
            sudo docker compose --env-file .env.prod -f docker-compose.prod.yml pull

            #  up 할 때 --env-file .env.prod 옵션 필수 추가!
            sudo docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --remove-orphans
            
            # 불필요한 이미지 정리 (공간 확보)
            sudo docker image prune -f