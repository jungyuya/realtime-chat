name: Deploy to Single VM

on:
  push:
    branches: [ "main" ]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1 # 미국 리전 (오와이아)
  REPO_NAME: realtime-chat-repo

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. GCP 인증 (JSON Key 방식)
      - name: Google Auth
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      # 2. Docker 설정
      - name: Configure Docker
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      # 3. 백엔드 빌드 & 푸시
      - name: Build and Push Backend
        run: |
          IMAGE_URI=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/backend
          docker build -t $IMAGE_URI:latest -f apps/backend/Dockerfile .
          docker push $IMAGE_URI:latest

      # 4. 프론트엔드 빌드 & 푸시
      - name: Build and Push Frontend
        run: |
          IMAGE_URI=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/frontend
          # [중요] 도메인 주소로 환경 변수 주입
          docker build \
            --build-arg VITE_API_BASE_URL=https://chat.jungyu.store \
            -t $IMAGE_URI:latest \
            -f apps/frontend/Dockerfile .
          docker push $IMAGE_URI:latest

      # 5. 설정 파일 서버로 전송 (SCP)
      # docker-compose.prod.yml, nginx 설정, .env.prod 파일을 서버로 복사합니다.
      - name: Copy files to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # 소스 파일들
          source: "docker-compose.prod.yml,nginx/conf.d/default.conf,.env.prod"
          # 서버의 타겟 디렉토리 (홈 디렉토리 아래 app 폴더)
          target: "~/app"
          # 파일 덮어쓰기 허용
          overwrite: true

      # 6. 서버에서 배포 명령어 실행 (SSH)
      - name: Deploy on Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. 작업 디렉토리로 이동
            cd ~/app
            
            # 2. GCP Artifact Registry 로그인을 위해 gcloud credential helper 설정 (필요시)
            # VM은 기본적으로 Service Account 권한이 있으면 pull 가능하지만,
            # 확실하게 하기 위해 docker login을 하거나, VM 권한을 믿습니다.
            # 여기서는 VM에 Artifact Registry Reader 권한이 있다고 가정하고 진행합니다.
            # (만약 권한 에러 나면 `gcloud auth configure-docker ...` 추가 필요)
            gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

            # 3. 최신 이미지 당겨오기
            # docker-compose.prod.yml 안에 이미지 주소가 있으므로 pull 가능
            sudo docker compose -f docker-compose.prod.yml pull

            # 4. 컨테이너 재시작 (변경된 것만)
            sudo docker compose -f docker-compose.prod.yml up -d --remove-orphans
            
            # 5. 불필요한 이미지 정리
            sudo docker image prune -f