version: '3.8'

services:
  # 1. Nginx
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      # [핵심] 호스트의 certbot/conf 폴더를 컨테이너 내부와 공유합니다.
      - ./certbot/conf:/etc/letsencrypt
    depends_on:
      - frontend
      - backend
    restart: always

  # 3. Backend
  backend:
    image: us-central1-docker.pkg.dev/realtime-chat-project-478509/realtime-chat-repo/backend:latest
    container_name: backend
    env_file:
      - .env.prod
    depends_on:
      - db
    restart: always

  # 4. Frontend
  frontend:
    image: us-central1-docker.pkg.dev/realtime-chat-project-478509/realtime-chat-repo/frontend:latest
    container_name: frontend
    restart: always

  # 5. Database
  db:
    image: postgres:15-alpine
    container_name: db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    env_file:
      - .env.prod
    ports:
      - "127.0.0.1:5433:5432"
    restart: always

volumes:
  postgres-data: