apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chat-ingress
  annotations:
    # [핵심 1] Terraform으로 만든 고정 IP의 '이름'을 적습니다.
    kubernetes.io/ingress.global-static-ip-name: realtime-chat-ingress-ip
    # [핵심 2] 위에서 만든 SSL 인증서의 '이름'을 적습니다.
    networking.gke.io/managed-certificates: chat-ssl-certificate
    # (선택) HTTP로 접속하면 HTTPS로 리다이렉트합니다.
    networking.gke.io/v1beta1.FrontendConfig: "ssl-redirect"
spec:
  rules:
  - http:
      paths:
      # 1. 백엔드 API 요청 (/api로 시작하는 것)
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 80
      # 2. WebSocket 요청 (/ws로 시작하는 것)
      - path: /ws
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 80
      # 3. 그 외 모든 요청 (프론트엔드 페이지)
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80