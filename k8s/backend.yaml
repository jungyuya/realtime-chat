# 1. Deployment: 백엔드 컨테이너를 실행하고 관리합니다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1 # 파드(Pod) 개수 (일단 1개로 시작)
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: asia-northeast3-docker.pkg.dev/realtime-chat-project-478509/realtime-chat-repo/backend:latest
        ports:
        - containerPort: 8080
        env:
        # 컨테이너 내부에서 사용할 환경 변수 (DB 접속 정보 등은 나중에 Secret으로 뺄 예정)
        - name: GIN_MODE
          value: release
---
# 2. Service: 백엔드에 고정 IP를 부여하고 외부로 노출합니다.
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  type: LoadBalancer # 외부에서 접속 가능한 공인 IP를 할당받습니다.
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 80      # 외부에서 접속할 포트
      targetPort: 8080 # 컨테이너 내부 포트