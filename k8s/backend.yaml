# 1. Deployment: 백엔드 컨테이너를 실행하고 관리합니다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1 # 파드(Pod) 개수 (일단 1개로 시작)
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: asia-northeast3-docker.pkg.dev/realtime-chat-project-478509/realtime-chat-repo/backend:latest
        ports:
        - containerPort: 8080
        env:
        - name: GIN_MODE
          value: release
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: SECRET_KEY
        # [추가] DB 접속 정보 주입
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: DB_PORT
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: DB_PASSWORD
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: DB_NAME       
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  annotations:
    # [핵심] 방금 만든 BackendConfig를 이 서비스에 적용하라는 지시입니다.
    cloud.google.com/backend-config: '{"default": "backend-config"}'
spec:
  type: NodePort
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080