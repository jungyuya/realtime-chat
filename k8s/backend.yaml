# 1. Deployment: 백엔드 컨테이너를 실행하고 관리합니다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1 # 파드(Pod) 개수 (일단 1개로 시작)
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: asia-northeast3-docker.pkg.dev/realtime-chat-project-478509/realtime-chat-repo/backend:latest
        ports:
        - containerPort: 8080
        env:
        # 컨테이너 내부에서 사용할 환경 변수 (DB 접속 정보 등은 나중에 Secret으로 뺄 예정)
        - name: GIN_MODE
          value: release
        # [임시 추가] Kubernetes Secret에서 SECRET_KEY를 가져와 환경 변수로 주입
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: backend-secrets 
              key: SECRET_KEY         
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  type: NodePort # [수정] LoadBalancer -> NodePort
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080