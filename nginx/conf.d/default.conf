# =================================================================
# 1. HTTP (Port 80) 서버 블록
# 역할: 모든 HTTP 요청을 HTTPS로 강제 리디렉션합니다.
# =================================================================
server {
    listen 80;
    # [확인] 본인의 도메인 이름이 정확한지 확인하세요.
    server_name chat.jungyu.store;

    # Let's Encrypt 인증서 갱신 시 사용하는 경로입니다.
    # 이 경로로 들어오는 요청은 HTTPS로 리디렉션하지 않고 그대로 처리해야 합니다.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 그 외의 모든 HTTP 요청은 동일한 경로의 HTTPS 주소로 영구 이동(301)시킵니다. 
    location / {
        return 301 https://$host$request_uri;
    }
}

# =================================================================
# 2. HTTPS (Port 443) 서버 블록
# 역할: 실제 애플리케이션 트래픽을 처리합니다.
# =================================================================
server {
    listen 443 ssl;
    # [확인] 본인의 도메인 이름이 정확한지 확인하세요.
    server_name chat.jungyu.store;

    # [핵심] SSL/TLS 설정
    # Certbot이 생성한 인증서 파일들의 경로를 지정합니다.
    ssl_certificate /etc/letsencrypt/live/chat.jungyu.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.jungyu.store/privkey.pem;

    # Certbot이 권장하는 최신 보안 프로토콜 및 암호화 설정을 불러옵니다.
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # --- 라우팅 규칙 (Reverse Proxy) ---

    # 1. API 요청 (/api/...) -> 백엔드 컨테이너로 전달
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. WebSocket 요청 (/ws) -> 백엔드 컨테이너로 전달 (업그레이드 헤더 포함)
    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. 그 외 모든 요청 (메인 페이지 등) -> 프론트엔드 컨테이너로 전달
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}