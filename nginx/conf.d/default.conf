# 1. HTTP (80) 서버: HTTPS로 리디렉션하는 역할만 수행
server {
    listen 80;
    server_name chat.jungyu.store; # [수정] 본인의 도메인

    # Certbot 인증을 위한 경로만 예외적으로 처리
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 그 외 모든 요청은 HTTPS로 영구 리디렉션 (301)
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS (443) 서버: 실제 서비스를 처리
server {
    listen 443 ssl;
    server_name chat.jungyu.store; 

    # [핵심] SSL 인증서 경로 설정
    ssl_certificate /etc/letsencrypt/live/chat.jungyu.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.jungyu.store/privkey.pem;

    # (보안 강화 옵션)
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 백엔드 API 프록시
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket 프록시
    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 프론트엔드 프록시
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}