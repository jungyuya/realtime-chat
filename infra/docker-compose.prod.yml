
version: '3.8'

services:
  # 1. Nginx (웹 서버 & 리버스 프록시)
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d # Nginx 설정 파일 마운트
      - ./certbot/conf:/etc/letsencrypt # SSL 인증서 마운트
      - ./certbot/www:/var/www/certbot # Certbot 챌린지 파일 마운트
    depends_on:
      - frontend
      - backend
    restart: always

  # 2. Certbot (SSL 인증서 발급/갱신)
  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # 12시간마다 갱신 시도하는 명령 (entrypoint 재정의)
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  # 3. Backend (Go API)
  backend:
    image: us-central1-docker.pkg.dev/realtime-chat-project-478509/realtime-chat-repo/backend:latest
    container_name: backend
    env_file:
      - .env.prod # 운영용 환경 변수 파일
    restart: always

  # 4. Frontend (React)
  frontend:
    image: us-central1-docker.pkg.dev/realtime-chat-project-478509/realtime-chat-repo/frontend:latest
    container_name: frontend
    restart: always

  # 5. Database (PostgreSQL)
  db:
    image: postgres:15-alpine
    container_name: db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    env_file:
      - .env.prod
    restart: always

volumes:
  postgres-data: